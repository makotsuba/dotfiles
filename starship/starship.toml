"$schema" = 'https://starship.rs/config-schema.json'

# コマンド出力と次の2行 prompt の間に1行の余白を入れる。
add_newline = true
palette = "catppuccin_macchiato"

format = """
$os\
$sudo\
$directory\
$git_branch\
$git_status\
$fill\
$direnv\
$nodejs\
$python\
$golang\
$ruby\
$rust\
$cmd_duration\
$time
$character"""

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[os]
disabled = false
style = "bold fg:base bg:blue"
format = "[](fg:blue)[$symbol]($style)[](fg:blue) "

[os.symbols]
Macos = "  "
Linux = "  "
Ubuntu = "  "
Debian = "  "

[sudo]
disabled = false
symbol = " 󰌆 sudo "
style = "bold fg:base bg:red"
format = "[](fg:red)[$symbol]($style)[](fg:red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "󰋞 ~"
read_only = "󰌾 "
style = "bold fg:base bg:lavender"
read_only_style = "bold fg:base bg:lavender"
format = "[](fg:lavender)[ $path ]($style)[$read_only]($read_only_style)[](fg:lavender)"

[git_branch]
symbol = " "
truncation_length = 32
truncation_symbol = "…"
style = "bold fg:sky bg:surface1"
format = "[](fg:surface1)[ $symbol$branch(:$remote_branch) ]($style)[](fg:surface1)"

[git_status]
style = "bold fg:lavender bg:surface1"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "󰏖 "
modified = "!${count}"
renamed = "»"
deleted = "✘${count}"
format = "[](fg:surface1)[ $all_status$ahead_behind ]($style)[](fg:surface1)"

[git_metrics]
disabled = true

[fill]
symbol = "─"
style = "fg:surface0"

[direnv]
disabled = false
symbol = "󰌠 "
style = "bold teal"
format = "[$symbol$allowed]($style) "

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol$version]($style) "

[python]
pyenv_version_name = false
symbol = "󰌠 "
style = "bold yellow"
format = "[$symbol$pyenv_prefix$version(\\($virtualenv\\))]($style) "

[golang]
symbol = " "
style = "bold sky"
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "bold peach"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "bold yellow"
format = "[󰔛 $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bold overlay1"
format = "[󰥔 $time]($style)"

[character]
success_symbol = "[❯](bold teal)[❯](bold lavender)[❯](bold blue)"
error_symbol = "[❯](bold red)[❯](bold maroon)[❯](bold pink)"
